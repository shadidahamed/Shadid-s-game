<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dead Zone: Advanced Raycast Survival</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mandatory Orientation Lock Warning for Mobile Layouts -->
    <div id="orientation-lock">
        <div class="lock-message">
            <div class="rotate-icon">🔄</div>
            <p>PLEASE ROTATE YOUR DEVICE TO LANDSCAPE TO SURVIVE</p>
        </div>
    </div>

    <div id="display-wrapper">
        <!-- Main Core Game Rendering Viewport -->
        <canvas id="gameCanvas" width="640" height="400"></canvas>

        <!-- Contextual Screen Menu System -->
        <div id="menu-overlay">
            <h1 id="menu-title">DEAD ZONE</h1>
            <p id="menu-subtitle">AN ADVANCED 2.5D RAYCAST SURVIVAL EXPERIENCE</p>
            <div id="level-indicator" style="display: none;"></div>
            <button id="btn-primary" class="menu-btn">START SURVIVAL</button>
            <button id="btn-restart" class="menu-btn" style="display: none;">RESTART ZONE</button>
        </div>

        <!-- Heads Up Display Data Layout -->
        <div id="hud-overlay" style="display: none;">
            <div class="hud-left">
                <div class="hud-card">VITAL SIGN: <span id="hp-display">100</span>%</div>
                <div class="hud-card">LEVEL: <span id="level-display">1</span>/6</div>
            </div>
            <div class="hud-right">
                <div class="hud-card" id="inv-display">TASK: FETCH THE IMMUNIZATION FUEL CELL</div>
            </div>
        </div>

        <!-- Mobile Touch Controls Deck Grid Layout -->
        <div id="mobile-control-deck">
            <div id="joystick-zone">
                <div id="virtual-joystick">
                    <div id="joystick-handle"></div>
                </div>
            </div>
            <div id="action-zone">
                <button id="touch-crouch" class="ctrl-btn">STEALTH</button>
                <button id="touch-heal" class="ctrl-btn">HEAL (Q)</button>
                <button id="touch-craft-a" class="ctrl-btn">CRAFT MED (A)</button>
                <button id="touch-craft-d" class="ctrl-btn">CRAFT SHIV (D)</button>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
