<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TLOU 2D Survival MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Game Display Canvas -->
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- Heads-Up Display Status Overlay -->
        <div id="hud">
            <div class="stat-row">HP: <span id="hp-val">100</span></div>
            <div id="inventory-ui">Alcohol: 0 | Binding: 0 | Blades: 0 | Medkits: 0 | Shivs: 1</div>
        </div>

        <!-- Mobile Touch Layout Panel (Hidden on Desktop) -->
        <div id="mobile-ui-panel">
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-knob"></div>
                </div>
            </div>
            <div id="action-zone">
                <button id="btn-crouch" class="mobile-btn">Crouch</button>
                <button id="btn-heal" class="mobile-btn">Heal (Q)</button>
                <button id="btn-craft-a" class="mobile-btn">Craft Medkit (A)</button>
                <button id="btn-craft-d" class="mobile-btn">Craft Shiv (D)</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
