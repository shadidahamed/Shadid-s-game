<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dead Zone: 2.5D Raycast Survival</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="display-wrapper">
        <!-- Render Viewport -->
        <canvas id="gameCanvas" width="640" height="400"></canvas>

        <!-- Minimalist Apocalyptic HUD -->
        <div id="hud-overlay">
            <div class="hud-card">VITAL SIGN: <span id="hp-display">100</span>%</div>
            <div class="hud-card" id="inv-display">ALC: 0 | BND: 0 | BLD: 0 || MED: 0 | SHV: 1</div>
        </div>

        <!-- Dynamic Mobile Controller Module -->
        <div id="mobile-control-deck">
            <div id="dpad-zone">
                <div id="virtual-joystick">
                    <div id="joystick-handle"></div>
                </div>
            </div>
            <div id="action-zone">
                <button id="touch-crouch" class="ctrl-btn">STEALTH</button>
                <button id="touch-heal" class="ctrl-btn">HEAL (Q)</button>
                <button id="touch-craft-a" class="ctrl-btn">CRAFT MED (A)</button>
                <button id="touch-craft-d" class="ctrl-btn">CRAFT SHIV (D)</button>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
