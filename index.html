<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOID DEFENDER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      color: #0ff;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 20px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #0ff;
      z-index: 100;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: none;
      z-index: 200;
    }
    #gameOver h1 {
      font-size: 60px;
      color: #f33;
      text-shadow: 0 0 20px #f33;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="hud">SCORE: 00000 | LIVES: 3</div>
  <canvas id="game" width="800" height="600"></canvas>

  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p id="finalScore" style="font-size:28px; margin:20px 0;">FINAL SCORE: 00000</p>
    <p>Press R to Restart</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
