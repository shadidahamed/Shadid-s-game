<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOID SURVIVAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050505;
      font-family: 'Courier New', monospace;
      color: #00f0ff;
    }
    canvas {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 20px;
      letter-spacing: 3px;
      text-shadow: 0 0 12px #00f0ff;
      z-index: 100;
      pointer-events: none;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: none;
      z-index: 200;
    }
    #gameOver h1 {
      font-size: 62px;
      margin: 0;
      color: #ff2a2a;
      text-shadow: 0 0 30px #ff2a2a;
    }
    #finalScore {
      font-size: 28px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div id="hud">SCORE: 00000 | HP: 100</div>
  
  <canvas id="game" width="800" height="600"></canvas>

  <div id="gameOver">
    <h1>SYSTEM FAILURE</h1>
    <div id="finalScore">FINAL SCORE: 00000</div>
    <p style="font-size:18px; margin:15px 0;">Press <strong>R</strong> to Restart</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
