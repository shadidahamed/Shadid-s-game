<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADID THE ZOMBIE KILLER // MAZE RUNNER MATRIX</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #05070a;
            --glass-bg: rgba(10, 14, 22, 0.85);
            --glass-border: rgba(255, 255, 255, 0.05);
            --concrete-grey: #4e535c;
            --alert-glow: #ff2a3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e5e7eb;
        }

        #viewport-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphic Minimalist HUD */
        .glass-hud-panel {
            position: absolute;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 8px;
            padding: 15px;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .top-left-status {
            top: 20px;
            left: 20px;
            min-width: 280px;
        }

        .top-right-telemetry {
            top: 20px;
            right: 20px;
            width: 130px;
            height: 130px;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #minimap-canvas {
            width: 120px;
            height: 120px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.7);
        }

        .status-header h1 {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fff;
        }

        .status-header p {
            font-size: 0.65rem;
            color: #9ca3af;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .metric-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            margin-top: 4px;
            border-radius: 2px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            width: 100%;
            background: var(--alert-glow);
            transition: width 0.1s ease;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.5;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* Fullscreen Overlay System */
        .fullscreen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #06080c;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }

        .terminal-box {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            text-align: center;
        }

        .action-submit-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #9ca3af;
            color: #fff;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 15px;
            font-family: inherit;
        }

        .action-submit-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="engine-boot-screen" class="fullscreen-overlay">
        <div class="terminal-box">
            <h2 style="color: #fff; letter-spacing: 2px; margin-bottom: 10px;">MAZE RUNNER PROTOCOL</h2>
            <p style="font-size: 0.8rem; color: #6b7280; margin-bottom: 15px;">
                Generating massive concrete matrix sectors. Simulating procedural sound waves. Click below to awaken your viewpoint.
            </p>
            <button class="action-submit-btn" id="initialize-call-trigger">ENTER THE MAZE</button>
        </div>
    </div>

    <div id="game-state-modal" class="fullscreen-overlay" style="display: none; background: rgba(5,7,10,0.95);">
        <div class="terminal-box" style="border-color: var(--alert-glow);">
            <h2 id="modal-title" style="color: var(--alert-glow); font-size: 1.2rem; margin-bottom: 10px;">CRITICAL OVERLOAD</h2>
            <p id="modal-desc" style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 20px;"></p>
            <button class="action-submit-btn" id="modal-action-btn">RE-ENTER SECTOR</button>
        </div>
    </div>

    <div id="viewport-container">
        <div class="glass-hud-panel top-left-status">
            <div class="status-header">
                <h1>SECTOR: WALL BLOCK 7</h1>
                <p>BRUTALIST MULTI-TIER COGNITION ENVIRONMENT</p>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:#9ca3af;">
                <span>SURVIVOR VITALS</span>
                <span id="vital-lbl">100%</span>
            </div>
            <div class="metric-bar-container">
                <div class="metric-fill" id="vital-bar"></div>
            </div>
        </div>

        <div class="glass-hud-panel top-right-telemetry">
            <canvas id="minimap-canvas" width="240" height="240"></canvas>
        </div>
    </div>

    <script>
        const CoreEngine = {
            scene: null, camera: null, renderer: null, clock: null,
            worldGroup: null, dynamicGroup: null,
            isEngineRunning: false, gridWidth: 24, // Expanded map layout matrix
            matrixGrid: [], activeDoorsArray: [], activeEntitiesArray: [],
            
            playerData: {
                gridX: 2.0, gridZ: 2.0, heightY: 0.0,
                viewAngle: 0.0, playerRadius: 0.45,
                vitalIntegrity: 100
            },
            
            inputTracker: { forward: false, backward: false, left: false, right: false },
            audioCtx: null, ambientHum: null
        };

        // --- PROCEDURAL AUDIO API OPERATIONS ---
        function initAudioEcosystem() {
            try {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                CoreEngine.audioCtx = new AudioCtxClass();
                
                // Deep monolithic mechanical concrete rumbling ambiance
                const droneOsc = CoreEngine.audioCtx.createOscillator();
                const droneGain = CoreEngine.audioCtx.createGain();
                const lowFilter = CoreEngine.audioCtx.createBiquadFilter();
                
                droneOsc.type = 'sawtooth';
                droneOsc.frequency.value = 48; 
                lowFilter.type = 'lowpass';
                lowFilter.frequency.value = 90;
                
                droneGain.gain.value = 0.15;
                
                droneOsc.connect(lowFilter);
                lowFilter.connect(droneGain);
                droneGain.connect(CoreEngine.audioCtx.destination);
                droneOsc.start();
            } catch(e) { console.log("Audio contexts deferred."); }
        }

        function playFootstepAudioSound() {
            if(!CoreEngine.audioCtx) return;
            const osc = CoreEngine.audioCtx.createOscillator();
            const gain = CoreEngine.audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(65, CoreEngine.audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(20, CoreEngine.audioCtx.currentTime + 0.12);
            
            gain.gain.setValueAtTime(0.25, CoreEngine.audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, CoreEngine.audioCtx.currentTime + 0.12);
            
            osc.connect(gain);
            gain.connect(CoreEngine.audioCtx.destination);
            osc.start(); osc.stop(CoreEngine.audioCtx.currentTime + 0.13);
        }

        function playDoorGrindAudio() {
            if(!CoreEngine.audioCtx) return;
            const osc = CoreEngine.audioCtx.createOscillator();
            const gain = CoreEngine.audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.value = 35;
            gain.gain.setValueAtTime(0.08, CoreEngine.audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, CoreEngine.audioCtx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(CoreEngine.audioCtx.destination);
            osc.start(); osc.stop(CoreEngine.audioCtx.currentTime + 0.52);
        }

        // --- GRAPHICS & CORE FRAMEWORKS ---
        function initEngineWorkspace() {
            const container = document.getElementById('viewport-container');
            CoreEngine.scene = new THREE.Scene();
            CoreEngine.clock = new THREE.Clock();

            // Narrowed field of view to achieve high-end depth perspective illusions
            CoreEngine.camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 400);
            
            CoreEngine.renderer = new THREE.WebGLRenderer({ antialias: true });
            CoreEngine.renderer.setSize(window.innerWidth, window.innerHeight);
            CoreEngine.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(CoreEngine.renderer.domElement);

            CoreEngine.worldGroup = new THREE.Group();
            CoreEngine.dynamicGroup = new THREE.Group();
            CoreEngine.scene.add(CoreEngine.worldGroup);
            CoreEngine.scene.add(CoreEngine.dynamicGroup);

            // Brutalist Concrete High-Contrast Light Rig
            const ambient = new THREE.AmbientLight(0x1a212d, 0.4);
            CoreEngine.scene.add(ambient);

            const directSun = new THREE.DirectionalLight(0xdbe4f0, 0.85);
            directSun.position.set(40, 120, 30);
            CoreEngine.scene.add(directSun);

            CoreEngine.scene.background = new THREE.Color(0x040608);
            CoreEngine.scene.fog = new THREE.FogExp2(0x040608, 0.022);

            bindControlsListeners();
        }

        function bindControlsListeners() {
            window.addEventListener('keydown', (e) => { handleKeyInput(e.key, true); });
            window.addEventListener('keyup', (e) => { handleKeyInput(e.key, false); });
            
            window.addEventListener('mousemove', (e) => {
                if(CoreEngine.isEngineRunning) {
                    CoreEngine.playerData.viewAngle -= e.movementX * 0.004;
                }
            });

            window.addEventListener('resize', () => {
                CoreEngine.camera.aspect = window.innerWidth / window.innerHeight;
                CoreEngine.camera.updateProjectionMatrix();
                CoreEngine.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function handleKeyInput(key, isActive) {
            if(isActive && !CoreEngine.audioCtx) initAudioEcosystem();
            switch(key) {
                case 'w': case 'W': case 'ArrowUp': CoreEngine.inputTracker.forward = isActive; break;
                case 's': case 'S': case 'ArrowDown': CoreEngine.inputTracker.backward = isActive; break;
                case 'a': case 'A': case 'ArrowLeft': CoreEngine.inputTracker.left = isActive; break;
                case 'd': case 'D': case 'ArrowRight': CoreEngine.inputTracker.right = isActive; break;
            }
        }

        // --- PROCEDURAL LABYRINTH ARCHITECTURE GRID ---
        function generateProceduralMazeData() {
            const size = CoreEngine.gridWidth;
            CoreEngine.matrixGrid = Array(size).fill().map(() => Array(size).fill(0));

            // Generate massive monolithic perimeter layout fields
            for(let i=0; i<size; i++) {
                CoreEngine.matrixGrid[0][i] = 1;
                CoreEngine.matrixGrid[size-1][i] = 1;
                CoreEngine.matrixGrid[i][0] = 1;
                CoreEngine.matrixGrid[i][size-1] = 1;
            }

            // Create towering interior maze partitions
            for(let r = 2; r < size - 2; r += 2) {
                for(let c = 2; c < size - 2; c += 2) {
                    CoreEngine.matrixGrid[r][c] = 1;
                    if(Math.random() > 0.3) CoreEngine.matrixGrid[r][c+1] = 1;
                    if(Math.random() > 0.4) CoreEngine.matrixGrid[r+1][c] = 1;
                }
            }

            // Keep startup vectors cleanly path-cleared
            CoreEngine.matrixGrid[1][1] = 0; CoreEngine.matrixGrid[1][2] = 0;
            CoreEngine.matrixGrid[2][1] = 0; CoreEngine.matrixGrid[2][2] = 0;

            // Specialized Interaction Coordinate Tokens
            CoreEngine.matrixGrid[12][12] = 2; // Staircase structural climb node
            CoreEngine.matrixGrid[13][12] = 5; // Heavy Monolithic Mechanical Gate Block
            CoreEngine.matrixGrid[14][12] = 3; // Section Completion Extraction Vortex
        }

        function constructPhysicalLabyrinth() {
            const size = CoreEngine.gridWidth;
            
            while(CoreEngine.worldGroup.children.length > 0) { CoreEngine.worldGroup.remove(CoreEngine.worldGroup.children[0]); }
            while(CoreEngine.dynamicGroup.children.length > 0) { CoreEngine.dynamicGroup.remove(CoreEngine.dynamicGroup.children[0]); }
            
            CoreEngine.activeDoorsArray = [];
            CoreEngine.activeEntitiesArray = [];

            // True Dark Brutalist Texturing Simulations
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: 0.9, metalness: 0.2 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e2024, roughness: 0.95 });
            const ceilMat = new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.8 });

            const wallGeo = new THREE.BoxGeometry(6, 24, 6); // Massive towering scale
            const areaGeo = new THREE.PlaneGeometry(size * 6, size * 6);

            // Ground Floor Plates
            const floor = new THREE.Mesh(areaGeo, floorMat);
            floor.rotation.x = -Math.PI/2;
            floor.position.set((size * 6)/2 - 3, -3, (size * 6)/2 - 3);
            CoreEngine.worldGroup.add(floor);

            // Industrial Concrete Ceiling Panels
            const ceiling = new THREE.Mesh(areaGeo, ceilMat);
            ceiling.rotation.x = Math.PI/2;
            ceiling.position.set((size * 6)/2 - 3, 21, (size * 6)/2 - 3);
            CoreEngine.worldGroup.add(ceiling);

            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    const token = CoreEngine.matrixGrid[r][c];
                    const tx = c * 6;
                    const tz = r * 6;

                    if(token === 1) {
                        const wallBlock = new THREE.Mesh(wallGeo, wallMat);
                        wallBlock.position.set(tx, 9, tz);
                        CoreEngine.worldGroup.add(wallBlock);
                        
                        // Add top industrial bracing architectural details to challenge perspective depth
                        if(Math.random() < 0.15) {
                            const beamGeo = new THREE.BoxGeometry(6, 1, 1);
                            const beam = new THREE.Mesh(beamGeo, wallMat);
                            beam.position.set(tx, 20, tz);
                            CoreEngine.worldGroup.add(beam);
                        }
                    } else if(token === 2) {
                        buildToweringStaircase(tx, tz);
                    } else if(token === 5) {
                        buildBrutalistMechanicalGate(tx, tz);
                    } else if(token === 3) {
                        buildExtractionVortex(tx, tz);
                    }
                }
            }

            spawnRetroHybridThreatEntity();
        }

        function buildToweringStaircase(x, z) {
            const stairGroup = new THREE.Group();
            stairGroup.position.set(x, -3, z);
            const stepMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.6, emissive: 0x112b7a });

            // Generates solid step segments rising cleanly to an elevated level of 6.0 units
            for(let i=0; i<20; i++) {
                const step = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.35, 0.35), stepMat);
                step.position.set(0, (i * 0.35) + 0.175, (i * 0.28) - 2.5);
                stairGroup.add(step);
            }
            CoreEngine.worldGroup.add(stairGroup);
        }

        function buildBrutalistMechanicalGate(x, z) {
            const gateGroup = new THREE.Group();
            gateGroup.position.set(x, 4, z); // Positioned high matching stair exit vector platforms

            const gateMat = new THREE.MeshStandardMaterial({ color: 0x1f232b, metalness: 0.8, roughness: 0.2 });
            const pane = new THREE.Mesh(new THREE.BoxGeometry(5.8, 8.0, 0.3), gateMat);
            gateGroup.add(pane);
            
            CoreEngine.worldGroup.add(gateGroup);
            CoreEngine.activeDoorsArray.push({
                meshTarget: gateGroup, gridX: x, gridZ: z,
                currentY: 4, targetY: 4, audioTriggered: false
            });
        }

        function buildExtractionVortex(x, z) {
            const beacon = new THREE.Group();
            beacon.position.set(x, 4, z);
            
            const core = new THREE.Mesh(new THREE.BoxGeometry(3, 7, 0.2), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
            beacon.add(core);
            
            const pLight = new THREE.PointLight(0x10b981, 3, 15);
            beacon.add(pLight);
            
            CoreEngine.worldGroup.add(beacon);
        }

        function spawnRetroHybridThreatEntity() {
            // High-End 2.5D multi-layered hybrid animated threat frame matrix
            const container = new THREE.Group();
            container.position.set(6 * 6, -1, 6 * 6);

            const mat = new THREE.MeshStandardMaterial({ color: 0x0a0d14, roughness: 0.1, side: THREE.DoubleSide });
            const torso = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 5.0), mat);
            torso.position.y = 2.5;
            container.add(torso);

            const redEye = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0022 }));
            redEye.position.set(0, 4.2, 0.1);
            container.add(redEye);

            CoreEngine.dynamicGroup.add(container);
            CoreEngine.activeEntitiesArray.push({
                rootMesh: container, originX: 6*6, originZ: 6*6, ticker: 0, speed: 2.8
            });
        }

        // --- KINEMATICS PHYSICS AND INTERFACE UPDATES ---
        function runPlayerKinematicsEngine(delta) {
            let movementSpeed = 8.5 * delta; // Optimized fluid traversal velocities
            let turnSpeed = 2.6 * delta;

            if(CoreEngine.inputTracker.left) CoreEngine.playerData.viewAngle += turnSpeed;
            if(CoreEngine.inputTracker.right) CoreEngine.playerData.viewAngle -= turnSpeed;

            let moveX = 0;
            let moveZ = 0;

            if(CoreEngine.inputTracker.forward) {
                moveX = Math.sin(CoreEngine.playerData.viewAngle) * movementSpeed;
                moveZ = Math.cos(CoreEngine.playerData.viewAngle) * movementSpeed;
            }
            if(CoreEngine.inputTracker.backward) {
                moveX = -Math.sin(CoreEngine.playerData.viewAngle) * movementSpeed;
                moveZ = -Math.cos(CoreEngine.playerData.viewAngle) * movementSpeed;
            }

            if(moveX !== 0 || moveZ !== 0) {
                if(Math.floor(CoreEngine.clock.getElapsedTime() * 4.8) % 2 === 0) {
                    playFootstepAudioSound();
                }
            }

            let nextPredictedX = CoreEngine.playerData.gridX + moveX;
            let nextPredictedZ = CoreEngine.playerData.gridZ + moveZ;

            if(!checkWallCollisionMatrix(nextPredictedX, CoreEngine.playerData.gridZ)) CoreEngine.playerData.gridX = nextPredictedX;
            if(!checkWallCollisionMatrix(CoreEngine.playerData.gridX, nextPredictedZ)) CoreEngine.playerData.gridZ = nextPredictedZ;

            // STAIRCASE SECTOR CONTEXT ROUTING
            const cx = Math.floor(CoreEngine.playerData.gridX);
            const cz = Math.floor(CoreEngine.playerData.gridZ);

            if(cx >= 0 && cx < CoreEngine.gridWidth && cz >= 0 && cz < CoreEngine.gridWidth) {
                const token = CoreEngine.matrixGrid[cz][cx];
                if(token === 2) { // Moving on Blue staircase track updates altitude
                    if(CoreEngine.inputTracker.forward && CoreEngine.playerData.heightY < 7.0) {
                        CoreEngine.playerData.heightY += 3.5 * delta;
                    }
                } else {
                    if(CoreEngine.playerData.heightY > 0.0 && CoreEngine.playerData.heightY < 6.5) {
                        CoreEngine.playerData.heightY -= 6.0 * delta;
                        if(CoreEngine.playerData.heightY < 0.0) CoreEngine.playerData.heightY = 0.0;
                    }
                }

                // Section Completion Event
                if(token === 3 && CoreEngine.playerData.heightY >= 6.0) {
                    executeLevelClear();
                }
            }

            // Lock camera view exactly inside point-of-view eye bounds
            const verticalEyeSocketOffset = 0.5;
            CoreEngine.camera.position.set(
                CoreEngine.playerData.gridX * 6,
                verticalEyeSocketOffset + CoreEngine.playerData.heightY,
                CoreEngine.playerData.gridZ * 6
            );

            const tx = CoreEngine.camera.position.x + Math.sin(CoreEngine.playerData.viewAngle);
            const tz = CoreEngine.camera.position.z + Math.cos(CoreEngine.playerData.viewAngle);
            CoreEngine.camera.lookAt(tx, CoreEngine.camera.position.y, tz);
        }

        function checkWallCollisionMatrix(tx, tz) {
            const r = CoreEngine.playerData.playerRadius;
            const offsets = [[0,0], [r,0], [-r,0], [0,r], [0,-r]];

            for(let i=0; i<offsets.length; i++) {
                const mx = Math.floor(tx + offsets[i][0]);
                const mz = Math.floor(tz + offsets[i][1]);
                if(mx < 0 || mx >= CoreEngine.gridWidth || mz < 0 || mz >= CoreEngine.gridWidth) return true;
                if(CoreEngine.matrixGrid[mz][mx] === 1) return true;
            }
            return false;
        }

        function runDynamicSystemsSimulation(delta) {
            const pWorldX = CoreEngine.playerData.gridX * 6;
            const pWorldZ = CoreEngine.playerData.gridZ * 6;

            // Animate mechanical sliding barriers
            CoreEngine.activeDoorsArray.forEach(door => {
                const dx = door.gridX - pWorldX;
                const dz = door.gridZ - pWorldZ;
                const dist = Math.sqrt(dx*dx + dz*dz);

                if(dist < 6.0 && CoreEngine.playerData.heightY >= 5.5) {
                    door.targetY = 11.0; // Slide gate upwards mechanically
                    if(!door.audioTriggered) {
                        playDoorGrindAudio();
                        door.audioTriggered = true;
                    }
                } else {
                    door.targetY = 4.0;
                    if(dist > 8.0) door.audioTriggered = false;
                }
                door.meshTarget.position.y += (door.targetY - door.meshTarget.position.y) * 4.0 * delta;
            });

            // Handle Threat Patrol Patterns and Retro-Billboard Rotations
            CoreEngine.activeEntitiesArray.forEach(ent => {
                ent.ticker += delta * ent.speed;
                ent.rootMesh.position.z = ent.originZ + Math.sin(ent.ticker) * 9.0;
                
                // Forces the sprite mesh panels to face camera flatly to challenge spatial perspective
                ent.rootMesh.lookAt(CoreEngine.camera.position.x, ent.rootMesh.position.y, CoreEngine.camera.position.z);

                const dx = ent.rootMesh.position.x - pWorldX;
                const dz = ent.rootMesh.position.z - pWorldZ;
                const currentDist = Math.sqrt(dx*dx + dz*dz);

                if(currentDist < 4.0) {
                    CoreEngine.playerData.vitalIntegrity -= 40.0 * delta;
                    CoreEngine.camera.position.x += (Math.random() * 0.2 - 0.1);
                }

                if(CoreEngine.playerData.vitalIntegrity <= 0) {
                    executeFailureTermination();
                }
            });
        }

        function drawRadarDisplays() {
            const canvas = document.getElementById('minimap-canvas');
            const ctx = canvas.getContext('2d');
            const size = CoreEngine.gridWidth;
            const cs = canvas.width / size;

            ctx.clearRect(0,0, canvas.width, canvas.height);

            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    const t = CoreEngine.matrixGrid[r][c];
                    if(t === 1) {
                        ctx.fillStyle = 'rgba(78, 83, 92, 0.3)';
                        ctx.fillRect(c*cs, r*cs, cs-0.5, cs-0.5);
                    } else if(t === 2) {
                        ctx.fillStyle = '#1d4ed8';
                        ctx.fillRect(c*cs, r*cs, cs-0.5, cs-0.5);
                    } else if(t === 3) {
                        ctx.fillStyle = '#10b981';
                        ctx.fillRect(c*cs, r*cs, cs-0.5, cs-0.5);
                    }
                }
            }

            const px = CoreEngine.playerData.gridX * cs;
            const pz = CoreEngine.playerData.gridZ * cs;

            ctx.beginPath();
            ctx.arc(px, pz, 3.5, 0, Math.PI*2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        function executeLevelClear() {
            CoreEngine.isEngineRunning = false;
            showResetOverlay("SECTOR PURGED", "You successfully navigated the elevated structural gates.", "RE-ENTER MAZE LAYER");
        }

        function executeFailureTermination() {
            CoreEngine.isEngineRunning = false;
            showResetOverlay("ELIMINATED", "Vitals flatlined inside the towering labyrinth channels.", "RE-MATERIALIZE SECTOR");
        }

        function showResetOverlay(title, desc, btnLbl) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-action-btn').innerText = btnLbl;
            document.getElementById('game-state-modal').style.display = 'flex';
        }

        function runMasterLoop() {
            requestAnimationFrame(runMasterLoop);
            const delta = CoreEngine.clock.getDelta();

            if(CoreEngine.isEngineRunning) {
                runPlayerKinematicsEngine(delta);
                runDynamicSystemsSimulation(delta);
                drawRadarDisplays();
                
                document.getElementById('vital-bar').style.width = `${Math.max(0, CoreEngine.playerData.vitalIntegrity)}%`;
                document.getElementById('vital-lbl').innerText = `${Math.floor(CoreEngine.playerData.vitalIntegrity)}%`;
            }
            CoreEngine.renderer.render(CoreEngine.scene, CoreEngine.camera);
        }

        // --- APPARATUS BOOTSTAPPING INTERFACE ---
        document.getElementById('initialize-call-trigger').addEventListener('click', () => {
            document.getElementById('engine-boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('engine-boot-screen').style.display = 'none';
                CoreEngine.isEngineRunning = true;
            }, 500);
        });

        document.getElementById('modal-action-btn').addEventListener('click', () => {
            document.getElementById('game-state-modal').style.display = 'none';
            CoreEngine.playerData.gridX = 2.0; CoreEngine.playerData.gridZ = 2.0; CoreEngine.playerData.heightY = 0.0;
            CoreEngine.playerData.vitalIntegrity = 100;
            generateProceduralMazeData();
            constructPhysicalLabyrinth();
            CoreEngine.isEngineRunning = true;
        });

        window.onload = function() {
            initEngineWorkspace();
            generateProceduralMazeData();
            constructPhysicalLabyrinth();
            runMasterLoop();
        };
    </script>
</body>
</html>
