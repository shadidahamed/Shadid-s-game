<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DEAD ZONE: Tactician Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="display-wrapper">
        <!-- 2.5D Pseudo-3D Escape Matrix Window -->
        <div id="viewport-container">
            <div class="crt-scanlines"></div>
            <div id="damage-flash"></div>
            <canvas id="gameCanvas" width="640" height="360"></canvas>
            
            <!-- Contextual Operational Overlays -->
            <div id="menu-overlay">
                <div class="terminal-box">
                    <h1 id="menu-title">DEAD ZONE</h1>
                    <div class="glitch-line"></div>
                    <p id="menu-subtitle">2.5D EXTRACTOR RAYCAST ENGINE</p>
                    <div id="level-indicator" style="display: none;"></div>
                    <div class="menu-actions">
                        <button id="btn-primary" class="menu-btn">INITIALIZE INFILTRATION</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- System Inventory Belt -->
        <div id="hud-overlay">
            <div class="hud-group left-group">
                <div class="hud-card bios-card">VITAL SIGN: <span id="hp-display">100</span>%</div>
                <div class="hud-card sector-card">SECTOR MAP: <span id="level-display">1</span> / 3</div>
            </div>
            <div class="hud-group right-group">
                <div class="hud-card task-card" id="inv-display">SYSTEM ONLINE</div>
            </div>
        </div>

        <!-- Input Deck Interface -->
        <div id="mobile-control-deck">
            <div class="joystick-container">
                <div id="virtual-joystick">
                    <div id="joystick-ring"></div>
                    <div id="joystick-handle"></div>
                </div>
            </div>
            <div id="action-grid">
                <button id="touch-crouch" class="action-btn stealth-btn">STEALTH TOGGLE</button>
                <button id="touch-heal" class="action-btn heal-btn">USE MED (Q)</button>
                <button id="touch-craft-a" class="action-btn craft-btn">CRAFT MED (A)</button>
                <button id="touch-craft-d" class="action-btn craft-btn">CRAFT SHIV (D)</button>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
