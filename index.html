<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VOID DEFENDER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: 'Courier New', monospace;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 18px;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
      z-index: 100;
      pointer-events: none;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: none;
      z-index: 200;
      color: #f33;
      text-shadow: 0 0 20px #f33;
    }
    #gameOver h1 {
      font-size: 48px;
      margin: 0;
    }
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #0ff;
      font-size: 14px;
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">SCORE: 00000 | LIVES: 10</div>
  <canvas id="game"></canvas>
  <div class="instructions">← DRAG LEFT to MOVE | TAP RIGHT to FIRE</div>

  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p id="finalScore" style="font-size:24px; margin:15px 0;">FINAL SCORE: 00000</p>
    <p>Tap screen to restart</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
