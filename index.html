<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOCLIP // LIMINAL ECHOES</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="1280" height="720"></canvas>
        
        <div id="ui-overlay">
            <canvas id="minimap" width="240" height="240"></canvas>
            
            <div id="sanity-bar" class="glass-panel">
                <div id="sanity-fill"></div>
            </div>
            
            <div class="hud-text top-left">
                LEVEL <span id="level-num">0</span> — <span id="level-name">THE LOBBY</span><br>
                <span id="coords">X:0000 Y:0000</span>
            </div>
            
            <div class="hud-text bottom-right">
                SANITY: <span id="sanity-text">72</span>%<br>
                STAMINA: <span id="stamina-text">100</span>%
            </div>

            <div id="warning" class="hud-text warning"></div>

            <div id="inventory" class="glass-panel"></div>
            <div id="log" class="glass-panel"></div>

            <div id="mobile-controls">
                <div class="joy" id="joystick">
                    <div class="joy-knob" id="knob"></div>
                </div>
            </div>
        </div>

        <!-- Screens -->
        <div id="intro-screen" class="screen">
            <div class="crt">
                <div class="tv-inner">
                    <h1>NOCLIP</h1>
                    <p>You fell through reality.</p>
                </div>
            </div>
            <button onclick="startGame()">ENTER THE VOID</button>
        </div>

        <div id="transition-screen" class="screen" style="display:none;"></div>
        <div id="death-screen" class="screen" style="display:none;"></div>
        <div id="ending-screen" class="screen" style="display:none;"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
